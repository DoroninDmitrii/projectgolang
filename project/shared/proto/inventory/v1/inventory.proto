syntax = "proto3";

package inventory.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/DoroninDmitrii/projectgolang/project/shared/pkg/proto/inventory/v1;inventoryv1";

// InventoryService управляет каталогом деталей для космических кораблей
service InventoryService {
  // GetPart возвращает деталь по UUID
  rpc GetPart(GetPartRequest) returns (GetPartResponse);
  // ListParts возвращает список деталей по фильтру или списку UUID
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse);
}

// Тип детали
enum PartType {
  // Тип детали не указан
  PART_TYPE_UNSPECIFIED = 0;

  // Корпус корабля
  PART_TYPE_HULL = 1;

  // Двигатель
  PART_TYPE_ENGINE = 2;

  // Энергетический щит
  PART_TYPE_SHIELD = 3;

  // Вооружение
  PART_TYPE_WEAPON = 4;
}

// Part представляет деталь космического корабля
message Part {
  // Уникальный идентификатор детали
  string uuid = 1;

  // Название детали
  string name = 2;

  // Описание детали
  string description = 3;

  // Цена в копейках (5000₽ = 500000)
  int64 price = 4;

  // Тип детали (enum)
  PartType part_type = 5;

  // Количество на складе
  int64 stock_quantity = 6;

  // Дата создания
  google.protobuf.Timestamp created_at = 7;
}

// Запрос на получение детали по UUID
message GetPartRequest {
  // UUID запрашиваемой детали
  string uuid = 1;
}

// Ответ с деталью
message GetPartResponse {
  // Найденная деталь
  Part part = 1;
}

// Запрос на получение списка деталей
message ListPartsRequest {
  // Фильтр по типу детали; PART_TYPE_UNSPECIFIED — без фильтрации
  PartType part_type = 1;

  // Фильтр по списку UUID; пустой список — без фильтрации
  repeated string uuids = 2;
}

// Ответ со списком деталей
message ListPartsResponse {
  // Детали, подошедшие под фильтр
  repeated Part parts = 1;
}
