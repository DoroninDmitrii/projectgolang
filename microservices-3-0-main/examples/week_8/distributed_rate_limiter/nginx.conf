# Nginx как gRPC load balancer для нескольких инстансов приложения.
#
# Как это работает:
# 1. Docker Compose запускает N реплик сервиса "app" (--scale app=3).
# 2. Docker встраивает DNS-сервер в сеть app-net. Когда кто-то внутри сети
#    резолвит имя "app", Docker DNS возвращает IP-адреса ВСЕХ реплик.
#    Например: app -> [172.18.0.4, 172.18.0.5, 172.18.0.6]
# 3. Nginx резолвит "app" через Docker DNS, получает список IP и раскидывает
#    запросы между ними round-robin (по умолчанию — по очереди).
# 4. ghz (нагрузочный тест) стучит в один порт Nginx — тот распределяет по инстансам.
#
# Важно: количество реплик НЕ задаётся в конфиге Nginx.
# Оно определяется при запуске: docker compose up --scale app=3.
# Nginx узнаёт о бэкендах через DNS — сколько IP вернул Docker DNS, столько и будет.
#
# Зачем это нужно:
# - Rate limiter хранит счётчики в Redis (общий для всех инстансов).
# - Даже если запрос попадает на разные инстансы — лимит единый.
# - Это и есть суть "распределённого" rate limiter.

events {
    # Максимальное количество одновременных соединений на один worker-процесс.
    # 1024 — хватает для нагрузочного теста, в проде обычно 4096+.
    worker_connections 1024;
}

http {
    # upstream — группа backend-серверов, между которыми Nginx балансирует запросы.
    #
    # "app:50051" — НЕ один сервер. Docker DNS резолвит имя "app" в IP-адреса
    # всех контейнеров этого сервиса. Если запущено 3 реплики — Nginx получит 3 IP
    # и будет чередовать запросы между ними (round-robin).
    #
    # Мы НЕ перечисляем серверы вручную (server 172.18.0.4:50051; server 172.18.0.5:50051; ...)
    # — Docker DNS делает это за нас автоматически.
    upstream grpc_backend {
        server app:50051;
    }

    server {
        # Nginx слушает порт 50051 по HTTP/2.
        # HTTP/2 обязателен — gRPC работает поверх HTTP/2 (мультиплексирование, бинарные фреймы).
        # Снаружи (с хоста) этот порт доступен благодаря ports: "50051:50051" в docker-compose.yml.
        listen 50051 http2;

        location / {
            # grpc_pass — директива Nginx для проксирования gRPC-трафика.
            # Аналог proxy_pass, но понимает HTTP/2 фреймы и gRPC-специфичные заголовки
            # (grpc-status, grpc-message и т.д.).
            # "grpc://" — схема без TLS. Для TLS используется "grpcs://".
            grpc_pass grpc://grpc_backend;
        }
    }
}
