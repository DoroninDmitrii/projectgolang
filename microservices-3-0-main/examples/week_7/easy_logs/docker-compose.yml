# Архитектура логирования:
# Go App → OTel Collector (:4317) → Elasticsearch (:9200) → Kibana (:5601)

services:

  # Хранилище логов
  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE}
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.name=${ES_CLUSTER_NAME}
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - microservices-net

  # Веб-интерфейс для просмотра логов (http://localhost:5601)
  kibana:
    image: ${KIBANA_IMAGE}
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - XPACK_SEARCHAPIKEYS_ENABLED=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "${KIBANA_PORT}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - microservices-net

  # Принимает логи от приложений (OTLP gRPC) и отправляет в Elasticsearch
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "${OTEL_METRICS_PORT}:8888"
      - "${OTEL_GRPC_PORT}:4317"
    restart: unless-stopped
    networks:
      - microservices-net
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es_data:

networks:
  microservices-net:
    name: microservices-net
    external: false
