# Pipeline: Go App → OTLP Receiver → memory_limiter + resource + batch → Prometheus Remote Write
#
# Push-модель: приложение отправляет метрики в коллектор,
# коллектор пушит их в Prometheus через Remote Write API.
#
# Зачем коллектор, если Prometheus v3 умеет принимать OTLP напрямую
# (--web.enable-otlp-receiver, endpoint /api/v1/otlp/v1/metrics)?
# Коллектор полезен когда нужно:
#   - обогащать метрики (resource processor — добавить environment, region и т.д.)
#   - батчить отправку (batch processor — снижает нагрузку на бэкенд)
#   - маршрутизировать в несколько бэкендов (Prometheus + Datadog + ...)
#   - трансформировать (фильтрация, переименование, агрегация)

# Секция receivers — откуда коллектор получает данные телеметрии.
receivers:
  # OTLP (OpenTelemetry Protocol) — стандартный протокол передачи телеметрии.
  # Приложение подключается к коллектору через SDK и отправляет метрики сюда.
  otlp:
    protocols:
      grpc:
        # 0.0.0.0 — слушать на всех сетевых интерфейсах (нужно для Docker).
        # 4317 — стандартный порт OTLP gRPC (4318 — для OTLP HTTP).
        endpoint: 0.0.0.0:4317

# Секция processors — обработка данных между приёмом и отправкой.
# Порядок в пайплайне важен: данные проходят через процессоры последовательно.
processors:
  # Ограничивает потребление памяти коллектором — защита от OOM при всплесках нагрузки.
  # Должен быть ПЕРВЫМ процессором в каждом пайплайне, чтобы отбрасывать данные
  # до того, как они попадут в другие процессоры и займут ещё больше памяти.
  memory_limiter:
    check_interval: 1s    # как часто проверять потребление памяти
    limit_mib: 256        # жёсткий лимит памяти — при превышении данные отбрасываются
                          # MiB (мебибайт) = 1024² байт, в отличие от MB (мегабайт) = 1000² байт
    spike_limit_mib: 64   # допустимый всплеск между проверками

  # Resource processor — добавляет атрибуты ресурса ко всем метрикам.
  # Приложение может не знать, в каком окружении работает (dev/staging/prod),
  # а коллектор добавляет эту информацию централизованно.
  # Это позволяет фильтровать метрики по окружению в Grafana.
  resource:
    attributes:
      - key: deployment.environment
        value: dev
        action: insert      # insert — добавить только если атрибут ещё не задан приложением

  # Batch processor — группирует метрики в батчи перед отправкой.
  # Снижает количество HTTP-запросов к Prometheus и повышает пропускную способность.
  # Должен быть ПОСЛЕДНИМ процессором: сначала обогащаем/фильтруем, потом батчуем.
  batch:
    send_batch_size: 1000   # отправить батч при накоплении N элементов (дефолт 8192)
    timeout: 5s             # или по таймауту, если батч не набрался (дефолт 200ms)

# Секция exporters — куда коллектор отправляет обработанные данные.
exporters:
  # Prometheus Remote Write — push-модель доставки метрик.
  # Коллектор сам отправляет метрики в Prometheus, а не ждёт, пока Prometheus их заберёт.
  # Это стандартный способ интеграции OTel с Prometheus.
  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"   # Remote Write API endpoint
    tls:
      insecure: true        # без TLS — допустимо для локальной разработки

# Секция extensions — дополнительные возможности коллектора, не связанные с пайплайнами.
extensions:
  # Health check endpoint — позволяет Docker/Kubernetes проверять, жив ли коллектор.
  health_check:
    endpoint: 0.0.0.0:13133  # GET http://localhost:13133/ → 200 OK

# Секция service — связывает всё воедино: какие extensions включить
# и как соединить receivers → processors → exporters в пайплайны.
service:
  # Телеметрия самого коллектора — его собственные метрики для мониторинга.
  telemetry:
    metrics:
      level: basic          # basic — базовые метрики коллектора (обработано/отброшено)
      # readers — массив "читателей" метрик. pull + prometheus = HTTP-эндпоинт /metrics
      # в Prometheus text format на 0.0.0.0:8888. В v0.151+ это единственный способ
      # экспонировать метрики коллектора (старое поле `address` удалено).
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  extensions: [health_check]

  # Пайплайн метрик: приём → обогащение → батчинг → отправка.
  # Порядок процессоров:
  #   1. memory_limiter — защита от OOM (первый!)
  #   2. resource — обогащение атрибутами окружения
  #   3. batch — группировка перед отправкой (последний!)
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite]
