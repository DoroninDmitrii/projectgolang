services:
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE}
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../../../otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "${OTEL_GRPC_PORT}:4317"
      - "${OTEL_COLLECTOR_METRICS_PORT}:8888"
    restart: unless-stopped
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8888/metrics"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      jaeger:
        condition: service_healthy

  jaeger:
    image: ${JAEGER_IMAGE}
    container_name: jaeger
    ports:
      - "${JAEGER_UI_PORT}:16686"
    environment:
      # Включает приём трейсов по протоколу OTLP (OpenTelemetry Protocol)
      - COLLECTOR_OTLP_ENABLED=true
      # Тип хранилища для трейсов. Badger — встраиваемая key-value БД (альтернативы: memory, elasticsearch, cassandra)
      - STORAGE_TYPE=badger
      # false = данные сохраняются на диск и переживают перезапуск контейнера (true = только в памяти)
      - BADGER_EPHEMERAL=false
      # Директория для хранения значений (value log) Badger
      - BADGER_DIRECTORY_VALUE=/badger/data
      # Директория для хранения ключей (LSM-tree) Badger
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger_data:/badger/data
      - jaeger_key:/badger/key
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:16686"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - microservices-net

volumes:
  jaeger_data:
  jaeger_key:

networks:
  microservices-net:
    external: true
