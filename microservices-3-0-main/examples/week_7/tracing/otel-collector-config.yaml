# Pipeline: Go App → OTLP Receiver → memory_limiter + resource + sampler + batch → Jaeger (OTLP)
#
# OpenTelemetry Collector — промежуточный слой между приложением и бэкендом трейсинга.
# Приложение отправляет спаны по OTLP gRPC, коллектор обрабатывает их (семплирование,
# обогащение, батчинг) и пересылает в Jaeger.

# Секция receivers — откуда коллектор получает данные телеметрии.
# Один receiver может обслуживать несколько пайплайнов (traces, metrics, logs).
receivers:
  # OTLP (OpenTelemetry Protocol) — стандартный протокол передачи телеметрии.
  # Приложение подключается к коллектору через SDK и отправляет спаны сюда.
  otlp:
    protocols:
      # gRPC — бинарный протокол на основе HTTP/2, обеспечивает высокую производительность
      # и низкие накладные расходы по сравнению с HTTP/JSON.
      grpc:
        # 0.0.0.0 — слушать на всех сетевых интерфейсах (нужно для Docker).
        # 4317 — стандартный порт OTLP gRPC (4318 — для OTLP HTTP).
        endpoint: 0.0.0.0:4317

# Секция processors — обработка данных между приёмом и отправкой.
# Порядок в пайплайне важен: данные проходят через процессоры последовательно.
processors:
  # Ограничивает потребление памяти коллектором — защита от OOM при всплесках нагрузки.
  # Должен быть ПЕРВЫМ процессором в каждом пайплайне, чтобы отбрасывать данные
  # до того, как они попадут в другие процессоры и займут ещё больше памяти.
  memory_limiter:
    check_interval: 1s    # как часто проверять потребление памяти
    limit_mib: 256        # жёсткий лимит памяти — при превышении данные отбрасываются
                          # MiB (мебибайт) = 1024² байт, в отличие от MB (мегабайт) = 1000² байт
    spike_limit_mib: 64   # допустимый всплеск между проверками

  # Resource processor — добавляет атрибуты ресурса ко всем спанам.
  # Атрибуты ресурса описывают источник телеметрии (сервис, окружение, регион и т.д.)
  # и позволяют фильтровать/группировать данные в Jaeger UI.
  resource:
    attributes:
      - key: deployment.environment
        value: dev
        action: insert      # insert — добавить только если атрибут ещё не задан приложением

  # Вероятностное (head-based) семплирование трейсов.
  # Решение о сохранении/отбрасывании принимается на основе TraceID,
  # поэтому все спаны одного трейса гарантированно попадают в одну группу.
  # 100% = все трейсы (для разработки), в продакшене обычно 1-10%.
  probabilistic_sampler:
    sampling_percentage: 100

  # Batch processor — группирует спаны в батчи перед отправкой в экспортер.
  # Снижает количество сетевых запросов и повышает пропускную способность.
  # Должен быть ПОСЛЕДНИМ процессором: сначала фильтруем/семплируем, потом батчуем.
  batch:
    send_batch_size: 1000   # отправить батч при накоплении N спанов (дефолт 8192)
    timeout: 5s             # или по таймауту, если батч не набрался (дефолт 200ms)

# Секция exporters — куда коллектор отправляет обработанные данные.
exporters:
  # Jaeger принимает данные по OTLP gRPC на порту 4317 (нативная поддержка с Jaeger v2).
  # В v0.151+ алиас "otlp" для экспортера deprecated — используем явное "otlp_grpc"
  # (есть отдельный "otlp_http" для HTTP-варианта). Формат otlp_grpc/<имя> позволяет
  # создавать несколько экспортеров одного типа с разными настройками.
  otlp_grpc/jaeger:
    endpoint: jaeger:4317   # имя хоста из Docker Compose сети
    tls:
      insecure: true        # без TLS — допустимо для локальной разработки

# Секция extensions — дополнительные возможности коллектора, не связанные с пайплайнами.
extensions:
  # Health check endpoint — позволяет Docker/Kubernetes проверять, жив ли коллектор.
  # Используется в healthcheck/readinessProbe.
  health_check:
    endpoint: 0.0.0.0:13133  # GET http://localhost:13133/ → 200 OK

# Секция service — связывает всё воедино: какие extensions включить
# и как соединить receivers → processors → exporters в пайплайны.
service:
  # Телеметрия самого коллектора — его собственные метрики для мониторинга.
  telemetry:
    metrics:
      # Поле `address` удалено в otel-collector v0.151+ (deprecated с v0.111).
      # Новый синтаксис — `readers` из OpenTelemetry config schema:
      # один или несколько MetricReader'ов, каждый со своим exporter'ом.
      # `pull` + `prometheus` = Prometheus-совместимый /metrics эндпоинт.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  extensions: [health_check]

  # Пайплайны определяют путь данных: откуда принять → как обработать → куда отправить.
  # Порядок процессоров критически важен:
  #   1. memory_limiter — защита от OOM (первый!)
  #   2. resource — обогащение атрибутами
  #   3. probabilistic_sampler — отбрасывание лишних трейсов
  #   4. batch — группировка перед отправкой (последний!)
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, probabilistic_sampler, batch]
      exporters: [otlp_grpc/jaeger]
