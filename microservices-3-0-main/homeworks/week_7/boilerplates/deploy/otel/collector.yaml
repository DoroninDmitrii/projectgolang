# Pipeline телеметрии (все три сигнала через один коллектор):
#   Трейсы:  Go App → OTLP Receiver → memory_limiter + resource + sampler + batch → Jaeger (OTLP)
#   Метрики: Go App → OTLP Receiver → memory_limiter + resource + batch → Prometheus (Remote Write)
#   Логи:    Go App → OTLP Receiver → memory_limiter + resource + transform + batch → Elasticsearch
#
# Один коллектор обрабатывает все три типа телеметрии (traces, metrics, logs).
# Каждый тип имеет свой пайплайн с нужными процессорами и экспортером.

# Секция receivers — откуда коллектор получает данные телеметрии.
# Один receiver обслуживает все три пайплайна одновременно.
receivers:
  # OTLP (OpenTelemetry Protocol) — стандартный протокол передачи телеметрии.
  # Приложение подключается к коллектору через SDK и отправляет все сигналы сюда.
  otlp:
    protocols:
      grpc:
        # 0.0.0.0 — слушать на всех сетевых интерфейсах (нужно для Docker).
        # 4317 — стандартный порт OTLP gRPC (4318 — для OTLP HTTP).
        endpoint: 0.0.0.0:4317

# Секция processors — обработка данных между приёмом и отправкой.
# Порядок в пайплайне важен: данные проходят через процессоры последовательно.
# Один процессор может использоваться в нескольких пайплайнах.
processors:
  # Ограничивает потребление памяти коллектором — защита от OOM при всплесках нагрузки.
  # Должен быть ПЕРВЫМ процессором в каждом пайплайне, чтобы отбрасывать данные
  # до того, как они попадут в другие процессоры и займут ещё больше памяти.
  memory_limiter:
    check_interval: 1s    # как часто проверять потребление памяти
    limit_mib: 256        # жёсткий лимит памяти — при превышении данные отбрасываются
                          # MiB (мебибайт) = 1024² байт, в отличие от MB (мегабайт) = 1000² байт
    spike_limit_mib: 64   # допустимый всплеск между проверками

  # Resource processor — добавляет атрибуты ресурса ко всем сигналам (трейсы, метрики, логи).
  # Атрибуты ресурса описывают источник телеметрии (сервис, окружение, регион и т.д.)
  # и позволяют фильтровать/группировать данные в Jaeger, Grafana и Kibana.
  resource:
    attributes:
      - key: deployment.environment
        value: dev
        action: insert      # insert — добавить только если атрибут ещё не задан приложением

  # Batch processor — группирует данные в батчи перед отправкой в экспортеры.
  # Снижает количество сетевых запросов и повышает пропускную способность.
  # Должен быть ПОСЛЕДНИМ процессором: сначала фильтруем/обогащаем, потом батчуем.
  batch:
    send_batch_size: 1000   # отправить батч при накоплении N элементов (дефолт 8192)
    timeout: 5s             # или по таймауту, если батч не набрался (дефолт 200ms)

  # Вероятностное (head-based) семплирование трейсов.
  # Решение о сохранении/отбрасывании принимается на основе TraceID,
  # поэтому все спаны одного трейса гарантированно попадают в одну группу.
  # 100% = все трейсы (для разработки), в продакшене обычно 1-10%.
  probabilistic_sampler:
    sampling_percentage: 100

  # Transform processor — модифицирует данные телеметрии с помощью OTTL-выражений
  # (OpenTelemetry Transformation Language).
  # Здесь устанавливаем режим маппинга ECS (Elastic Common Schema) — стандартную схему
  # данных Elasticsearch, которая обеспечивает совместимость с Kibana дашбордами.
  transform:
    log_statements:
      - context: scope      # контекст scope — атрибуты инструментации (библиотеки/модуля)
        statements:
          - set(attributes["elastic.mapping.mode"], "ecs")

# Секция exporters — куда коллектор отправляет обработанные данные.
# Каждый экспортер привязан к своему пайплайну.
exporters:
  # Jaeger принимает данные по OTLP gRPC на порту 4317 (нативная поддержка с Jaeger v2).
  # Формат otlp/<имя> позволяет создавать несколько экспортеров одного типа
  # с разными настройками (например, otlp/jaeger и otlp/tempo).
  otlp/jaeger:
    endpoint: jaeger:4317   # имя хоста из Docker Compose сети
    tls:
      insecure: true        # без TLS — допустимо для локальной разработки

  # Prometheus Remote Write — push-модель доставки метрик.
  # Коллектор сам отправляет метрики в Prometheus, а не ждёт, пока Prometheus их заберёт.
  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"   # Remote Write API endpoint
    tls:
      insecure: true

  # Elasticsearch exporter — отправляет логи в Elasticsearch по HTTP.
  # Логи индексируются в указанный индекс и доступны для поиска в Kibana.
  elasticsearch:
    endpoints: ["http://elasticsearch:9200"]
    tls:
      insecure: true
    logs_index: "otel-logs"   # имя индекса в Elasticsearch для логов

# Секция extensions — дополнительные возможности коллектора, не связанные с пайплайнами.
extensions:
  # Health check endpoint — позволяет Docker/Kubernetes проверять, жив ли коллектор.
  health_check:
    endpoint: 0.0.0.0:13133  # GET http://localhost:13133/ → 200 OK

# Секция service — связывает всё воедино: какие extensions включить
# и как соединить receivers → processors → exporters в пайплайны.
service:
  # Телеметрия самого коллектора — его собственные метрики для мониторинга.
  telemetry:
    metrics:
      level: basic          # basic — базовые метрики коллектора (обработано/отброшено)

  extensions: [health_check]

  # Три пайплайна — по одному на каждый тип телеметрии.
  # Общий паттерн порядка процессоров:
  #   1. memory_limiter — защита от OOM (всегда первый!)
  #   2. resource — обогащение атрибутами окружения
  #   3. [специфичные] — семплирование (трейсы) или трансформация (логи)
  #   4. batch — группировка перед отправкой (всегда последний!)
  pipelines:
    # Трейсы → Jaeger
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, probabilistic_sampler, batch]
      exporters: [otlp/jaeger]

    # Метрики → Prometheus
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite]

    # Логи → Elasticsearch → Kibana
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, transform, batch]
      exporters: [elasticsearch]
