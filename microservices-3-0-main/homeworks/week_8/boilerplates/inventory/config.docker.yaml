grpc:
  host: "0.0.0.0"
  port: "50051"

pg:
  host: "postgres-inventory"
  port: "5432"
  database: "inventory-service"
  user: "inventory-service-user"
  password: "inventory-service-password"
  sslmode: "disable"

iam_client:
  address: "iam-service:50053"

logger:
  level: "info"

otel:
  service_name: "inventory-service"
  service_version: "1.0.0"
  environment: "docker"
  collector_endpoint: "otel-collector:4317"
  enable_otlp: true
  sampling_ratio: 1.0
